apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: loja-veloz
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: loja-veloz
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
      protocol: TCP

